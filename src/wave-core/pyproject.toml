[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wave-core"
version = "0.1.0"
description = "Core DSP, audio analysis, similarity and mixing engine for Wave"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.10",
    "numpy",
    "scipy",
    "soundfile",
    "mutagen",
    "pyloudnorm",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.1",
    "pgvector",
    "typer>=0.9.0",
    "rich",
    "pydantic",
    "pydantic-settings",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "matplotlib",
    "ruff",
    "httpx",
]

[project.scripts]
wave = "wave_core.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["wave_core*"]
