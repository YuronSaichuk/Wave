services:
  db:
    image: pgvector/pgvector:pg16
    container_name: wave-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: wave
      POSTGRES_DB: wave
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wave"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
